name: Forge Full Coding Mission Proof

on:
  push:
    branches:
      - test/forge-e2e-proof

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: forge-e2e-proof-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  full-mission:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Forge implementation under test
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Forge dependencies
        run: npm install

      - name: Run full coding mission without Gemini credentials
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TASK_ID: e2e-normalize-task-id-20261012
          TASK_TITLE: Extract task ID normalization into a reusable utility
          TASK_DESC: >-
            Refactor the existing task ID sanitization in src/agent/forge-runner.ts into a
            reusable exported function in a new src/utils/normalizeTaskId.ts file. Preserve
            behavior exactly: replace every character outside A-Z, a-z, 0-9, underscore and
            hyphen with a hyphen; truncate to 64 characters; and return "task" when the
            result is empty. Update forge-runner.ts to import and call the utility instead
            of embedding the expression. Keep the change limited to those two source files.
            Requirements: REQ-1 reusable utility exists and is exported; REQ-2 existing
            task ID normalization behavior is preserved; REQ-3 runner uses the utility.
            Acceptance criteria: TypeScript lint and production build pass on the patched
            target tree; Forge validates the patch, commits the exact tested file contents,
            and opens a pull request. Do not modify package manifests, workflows, scripts,
            tests, or unrelated files.
        run: npx tsx src/agent/forge-runner.ts

      - name: Upload Forge execution report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-e2e-proof-${{ github.run_id }}
          path: .firstborn/evidence/
          if-no-files-found: warn
