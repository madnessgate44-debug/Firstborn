name: Forge Full Coding Mission Proof

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: forge-e2e-proof-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  full-mission:
    if: github.event.pull_request.head.ref == 'feat/freelm-keyless-routing'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Forge implementation under test
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Forge dependencies
        run: npm install

      - name: Run full coding mission without Gemini credentials
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TASK_ID: e2e-test-summary-counts-20261012
          TASK_TITLE: Report passed and failed check counts in Forge summary
          TASK_DESC: >-
            In src/agent/forge-runner.ts, add two summary lines immediately after the
            existing "Tests Run:" line: "Tests Passed:" must count report.testResults entries
            whose status is PASSED; "Tests Failed:" must count entries whose status is not
            PASSED. Preserve all existing output and behavior. Modify only this existing
            file, using one small exact-anchor edit. Requirements: REQ-1 the summary prints
            a passed-check count; REQ-2 the summary prints a failed/error-check count.
            Acceptance criteria: TypeScript lint and production build pass on the patched
            target tree; Forge commits the exact tested file contents and opens a pull
            request. Do not modify package manifests, workflows, scripts, tests, or any
            other source files.
        run: npx tsx src/agent/forge-runner.ts

      - name: Upload Forge execution report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-e2e-proof-${{ github.run_id }}
          path: .firstborn/evidence/
          if-no-files-found: warn
