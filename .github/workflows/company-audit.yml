name: Forge Company Audit

# The software company performs a read-only audit of a target repository.
# Forge and the company are one thing, living together on `main`.
# Read-only by default: no target writes, no target code executed. Optional runtime
# verification (off by default) clones the target and runs its checks in a scratch dir.
on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: 'Target repository in owner/repo format'
        required: true
        default: 'madnessgate44-debug/Amina'
      attempts:
        description: 'Independent attempts per audit lens'
        required: true
        default: '2'
      runtime_verification:
        description: 'Also clone the target and run its lint/test/build in an isolated scratch dir (executes target code)'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  company-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the company
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the company audit
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORGE_AUDIT_ATTEMPTS: ${{ inputs.attempts }}
          FORGE_AUDIT_RUNTIME: ${{ inputs.runtime_verification }}
        run: |
          FLAG=""
          if [ "$FORGE_AUDIT_RUNTIME" = "true" ]; then FLAG="--runtime"; fi
          npx tsx scripts/audit.ts "${{ inputs.target_repo }}" $FLAG

      - name: Upload the audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: company-audit
          path: |
            .firstborn/evidence/company-audit.md
            .firstborn/evidence/company-audit.json
          if-no-files-found: warn
