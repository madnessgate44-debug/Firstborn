name: Forge Coding Agent

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      task_id:
        description: 'Task Identifier'
        required: true
        default: 'manual-task'
      task_title:
        description: 'Task Title'
        required: true
        default: 'Run Repository Verification'
      task_desc:
        description: 'Task Detailed Description'
        required: true
        default: 'Verify tests and baseline commit integrity'

concurrency:
  group: forge-${{ github.event.issue.number || github.event.inputs.task_id || github.run_id }}
  cancel-in-progress: true

jobs:
  run-forge:
    # Only run when issue has label 'forge-task' or triggered manually
    if: github.event_name == 'workflow_dispatch' || (contains(github.event.issue.labels.*.name, 'forge-task') && github.event.issue.author_association == 'OWNER')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Forge Agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TASK_ID: ${{ github.event.issue.number || github.event.inputs.task_id }}
          TASK_TITLE: ${{ github.event.issue.title || github.event.inputs.task_title }}
          TASK_DESC: ${{ github.event.issue.body || github.event.inputs.task_desc }}
        run: npx tsx src/agent/forge-runner.ts

      - name: Upload Execution Evidence Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-evidence
          path: .firstborn/evidence/
