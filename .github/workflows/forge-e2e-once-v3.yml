name: One-Time Forge E2E Proof v3

on:
  push:
    branches:
      - test/forge-e2e-once-v3

permissions:
  contents: read

jobs:
  run-forge-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout isolated test branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Initialize execution evidence
        run: |
          mkdir -p .firstborn/evidence
          printf '{"status":"STARTED","note":"One-time isolated E2E proof v3; detailed agent report follows."}\n' > .firstborn/evidence/workflow-preflight.json

      - name: Install Dependencies
        run: npm install

      - name: Run Forge Agent (strict keyless only)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIRSTBORN_KEYLESS_ONLY: 'true'
          TASK_ID: e2e-proof-20261012g
          TASK_TITLE: Add mission proof metadata field
          TASK_DESC: >-
            Modify only src/types/agent.ts. Inside the existing TaskDefinition interface, add optional property missionProof?: boolean; immediately after allowPrCreation: boolean;. Use one exact-anchor edit: find exactly the text allowPrCreation: boolean; and replace it with allowPrCreation: boolean; followed by a newline and two spaces then missionProof?: boolean;. Do not create new files. Do not modify any other interface, workflow, package manifest, script, secret, or security control. Requirements: REQ-1 missionProof is an optional boolean field on TaskDefinition; REQ-2 no unrelated files are changed. Acceptance criteria: TypeScript lint and production build pass; Forge validates and applies the patch in an isolated checkout, commits exactly the tested file contents, and opens a pull request. Strict keyless-only mode must be used, with provider credentials removed and Gemini fallback disabled. Report actual provider/model, route errors, changed file, test results, head commit SHA, PR URL, and evidence artifact.
        run: npx tsx src/agent/forge-runner.ts

      - name: Upload Execution Evidence Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-e2e-once-v3-${{ github.run_id }}
          path: .firstborn/evidence/
