name: One-Time Forge E2E Proof v2

on:
  push:
    branches:
      - test/forge-e2e-once-v2

permissions:
  contents: read

jobs:
  run-forge-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout isolated test branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Initialize execution evidence
        run: |
          mkdir -p .firstborn/evidence
          printf '{"status":"STARTED","note":"One-time isolated E2E proof v2; detailed agent report follows."}\n' > .firstborn/evidence/workflow-preflight.json

      - name: Install Dependencies
        run: npm install

      - name: Run Forge Agent (strict keyless only)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIRSTBORN_KEYLESS_ONLY: 'true'
          TASK_ID: e2e-proof-20261012f
          TASK_TITLE: Add mission proof metadata type
          TASK_DESC: >-
            In src/types/agent.ts, add an exported type alias named MissionProofMetadata with exactly three fields: taskId: string; baseSha: string; proofType: 'forge-e2e'. Add it at the end of the file after the TaskExecutionReport interface. Modify only src/types/agent.ts with one small exact-anchor edit. Do not change workflows, package manifests, scripts, secrets, or security controls. Requirements: REQ-1 the type is exported with the three fields; REQ-2 proofType is restricted to the literal 'forge-e2e'. Acceptance criteria: target TypeScript lint and production build pass; Forge validates and applies the patch in an isolated checkout, commits the exact tested file contents, and opens a pull request. Strict keyless-only mode must be used, with provider credentials removed and Gemini fallback disabled. Report actual provider/model, raw keyless route errors, changed file, test results, head commit SHA, PR URL, and evidence artifact.
        run: npx tsx src/agent/forge-runner.ts

      - name: Upload Execution Evidence Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-e2e-once-v2-${{ github.run_id }}
          path: .firstborn/evidence/
