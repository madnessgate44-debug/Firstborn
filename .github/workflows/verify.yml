name: Verification and Build Checks

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    # Least privilege: no write permissions, no model execution, no secrets injected
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Lint Check
        run: npm run lint

      - name: Run Build
        run: npm run build
