name: Verification and Build Checks

on:
  workflow_dispatch:
  push:
    branches: [main, 'fix/**']

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Run Lint Check
        run: npm run lint

      - name: Run Build
        run: npm run build

      - name: Smoke Test Keyless Primary Model
        run: npm run model:smoke
