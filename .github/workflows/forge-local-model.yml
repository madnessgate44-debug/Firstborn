name: Forge Local Model Run

# Manual only. Runs Forge against this PUBLIC repo using an open-weight model served on the
# runner itself (llama.cpp, MIT; Qwen2.5-Coder-7B-Instruct GGUF, Apache-2.0). No secrets, no
# external model provider, no schedule, read-only token. Only public-source-derived results are
# uploaded, after a secret-pattern scrub.

on:
  workflow_dispatch:
    inputs:
      task_title:
        description: Task title (public text only)
        required: true
        type: string
      task_desc:
        description: Task description with exact anchor lines (public text only)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: forge-local-model
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest   # standard GitHub-hosted runner, free for public repositories
    timeout-minutes: 120
    outputs:
      has_patch: ${{ steps.patch_meta.outputs.has_patch }}
      patch_sha256: ${{ steps.patch_meta.outputs.patch_sha256 }}
      report_sha256: ${{ steps.patch_meta.outputs.report_sha256 }}
      checks_passed: ${{ steps.patch_meta.outputs.checks_passed }}
    env:
      LLAMA_TAG: b12709
      LLAMA_TGZ_SHA256: "1bab2ad0c7268f2f081e490db7234928fdfc75b2ff60d3dcf406ac02cd45be0a"
      MODEL_FILE: qwen2.5-coder-7b-instruct-q4_k_m.gguf
      MODEL_BYTES: "4683073536"
      MODEL_SHA256: "509287f78cb4d4cf6b3843734733b914b2c158e43e22a7f4bf5e963800894d3c"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Runner facts
        run: |
          echo "nproc=$(nproc)"; free -m | head -2; df -h . | tail -1
      - name: Install dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts
      - name: Fetch llama.cpp release binary and model weights (public downloads)
        run: |
          set -euo pipefail
          curl -fsSL -o llama.tgz "https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_TAG}/llama-${LLAMA_TAG}-bin-ubuntu-x64.tar.gz"
          echo "${LLAMA_TGZ_SHA256}  llama.tgz" | sha256sum -c -
          mkdir -p llama && tar xzf llama.tgz -C llama --strip-components=1
          ls llama | head -5
          curl -fL --retry 3 -o "$MODEL_FILE" "https://huggingface.co/Qwen/Qwen2.5-Coder-7B-Instruct-GGUF/resolve/main/${MODEL_FILE}"
          test "$(stat -c %s "$MODEL_FILE")" = "$MODEL_BYTES"
          echo "${MODEL_SHA256}  ${MODEL_FILE}" | sha256sum -c -
      - name: Start local model server (loopback only)
        run: |
          set -euo pipefail
          nohup ./llama/llama-server -m "$MODEL_FILE" --host 127.0.0.1 --port 8080 -c 16384 -t "$(nproc)" --parallel 1 > llama-server.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; then echo "model server ready after ${i}x5s"; exit 0; fi
            sleep 5
          done
          tail -40 llama-server.log
          exit 1
      - name: Run Forge on the local model (read-only token, no push)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_REPO: ${{ github.repository }}
          TASK_ID: local-model-${{ github.run_id }}
          TASK_TITLE: ${{ inputs.task_title }}
          TASK_DESC: ${{ inputs.task_desc }}
          FORGE_LOCAL_MODEL_URL: http://127.0.0.1:8080
          FORGE_LOCAL_MODEL_NAME: qwen2.5-coder-7b-instruct-q4_k_m
          FORGE_LOCAL_MODEL_TIMEOUT_S: "900"
          FORGE_MAX_ATTEMPTS: "1"
        run: timeout 2400 npx tsx src/agent/forge-runner.ts 2>&1 | tee forge-run.log
      - name: Print evidence summary to log
        if: always()
        run: |
          if [ ! -d .firstborn/evidence ]; then
            echo "No .firstborn/evidence directory found"
            exit 0
          fi
          ls -lh .firstborn/evidence
          secret_regex='ghs_[A-Za-z0-9]{20,}|github_pat_|gho_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|Bearer [A-Za-z0-9._-]{20,}'
          for f in .firstborn/evidence/*; do
            [ -e "$f" ] || continue
            fname="$(basename "$f")"
            if [ -f "$f" ] && grep -qIE "$secret_regex" "$f"; then
              echo "::group::${fname}"
              echo "skipped: secret-like content"
              echo "::endgroup::"
            elif [ -f "$f" ]; then
              echo "::group::${fname}"
              head -c 30000 "$f"
              echo ""
              echo "::endgroup::"
            fi
          done
      - name: Scrub and stage aggregate artifacts
        if: always()
        run: |
          mkdir -p out
          cp -r .firstborn/evidence out/ 2>/dev/null || true
          cp forge-run.log out/ 2>/dev/null || true
          tail -60 llama-server.log > out/llama-server-tail.log 2>/dev/null || true
          if grep -rIE 'ghs_[A-Za-z0-9]{20,}|github_pat_|gho_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|Bearer [A-Za-z0-9._-]{20,}' out; then
            echo "secret-like content found; removing artifacts"; rm -rf out; mkdir out; echo scrubbed > out/SCRUBBED.txt
          fi
      - name: Compute patch metadata
        id: patch_meta
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          expected_task_id="local-model-${RUN_ID}"
          src_report=".firstborn/evidence/${expected_task_id}.json"
          src_patch=".firstborn/evidence/${expected_task_id}.patch"
          out_report="out/evidence/${expected_task_id}.json"
          out_patch="out/evidence/${expected_task_id}.patch"
          ev_patches=(.firstborn/evidence/*.patch)

          valid=1
          checks_passed=0
          patch_sha=""
          report_sha=""

          if [ "${#ev_patches[@]}" -ne 1 ] || [ "${ev_patches[0]}" != "$src_patch" ] || [ ! -s "$src_patch" ]; then
            valid=0
          else
            patch_bytes="$(wc -c < "$src_patch")"
            if [ "$patch_bytes" -gt 50000 ]; then
              valid=0
            fi
          fi

          if [ ! -f "$src_report" ] || [ ! -f "$out_report" ] || [ ! -f "$out_patch" ]; then
            valid=0
          fi

          if [ "$valid" -eq 1 ] && jq -e . "$src_report" >/dev/null 2>&1; then
            patch_base="$(basename "$src_patch")"
            checks_passed="$(jq -r '[.testResults[]? | select(.exitCode == 0 and .status == "PASSED")] | length' "$src_report")"
            ok="$(jq -r --arg tid "$expected_task_id" --arg pbase "$patch_base" '
              .taskId == $tid
              and ((.testResults | type) == "array")
              and ((.testResults | length) >= 3)
              and ([.testResults[] | select(.exitCode == 0 and .status == "PASSED")] | length) == (.testResults | length)
              and (((.scopeDrift // []) | type) == "array")
              and (((.scopeDrift // []) | length) == 0)
              and (
                .status == "VERIFYING"
                or .status == "PR_OPENED"
                or (
                  .status == "BLOCKED"
                  and ((.blockerReason // "") | (startswith("GitHub branch operation blocked:") or startswith("Permission policy")))
                )
              )
              and (((.artifactPaths.patch // "") | split("/") | last) == $pbase)
            ' "$src_report")"

            if [ "$ok" = "true" ]; then
              src_patch_sha="$(sha256sum "$src_patch" | awk '{print $1}')"
              out_patch_sha="$(sha256sum "$out_patch" | awk '{print $1}')"
              src_report_sha="$(sha256sum "$src_report" | awk '{print $1}')"
              out_report_sha="$(sha256sum "$out_report" | awk '{print $1}')"
              if [ "$src_patch_sha" = "$out_patch_sha" ] && [ "$src_report_sha" = "$out_report_sha" ]; then
                patch_sha="$out_patch_sha"
                report_sha="$out_report_sha"
              else
                valid=0
              fi
            else
              valid=0
            fi
          else
            valid=0
          fi

          if [ "$valid" -eq 1 ]; then
            {
              echo "has_patch=true"
              echo "patch_sha256=${patch_sha}"
              echo "report_sha256=${report_sha}"
              echo "checks_passed=${checks_passed}"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "has_patch=false"
              echo "patch_sha256="
              echo "report_sha256="
              echo "checks_passed=0"
            } >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge-local-model-result
          path: out
          retention-days: 7

  publish:
    needs: run
    if: needs.run.outputs.has_patch == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: forge-local-model-publish
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          name: forge-local-model-result
          path: out
      - name: Validate patch and open draft PR
        env:
          RUN_ID: ${{ github.run_id }}
          EXPECTED_SHA256: ${{ needs.run.outputs.patch_sha256 }}
          EXPECTED_REPORT_SHA256: ${{ needs.run.outputs.report_sha256 }}
          EXPECTED_CHECKS_PASSED: ${{ needs.run.outputs.checks_passed }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          expected_task_id="local-model-${RUN_ID}"
          expected_patch="out/evidence/${expected_task_id}.patch"
          expected_report="out/evidence/${expected_task_id}.json"

          branch="forge/local-model-${RUN_ID}"
          if git ls-remote --exit-code --heads origin "refs/heads/${branch}" >/dev/null 2>&1; then
            echo "Branch already exists on origin: ${branch}" >&2
            exit 1
          fi

          if [ -n "$(git status --porcelain -- . ':(exclude)out' ':(exclude)out/')" ]; then
            echo "Working tree is not clean (excluding out/) before applying patch." >&2
            exit 1
          fi

          patches=(out/evidence/*.patch)
          if [ "${#patches[@]}" -ne 1 ]; then
            echo "Expected exactly one patch file in out/evidence/, found ${#patches[@]}." >&2
            exit 1
          fi

          if [ "${patches[0]}" != "$expected_patch" ]; then
            echo "Unexpected patch filename '${patches[0]}'; expected '$expected_patch'." >&2
            exit 1
          fi

          patch="$expected_patch"
          if [ ! -s "$patch" ]; then
            echo "Patch file is missing or empty: $patch" >&2
            exit 1
          fi

          if [ ! -s "$expected_report" ]; then
            echo "Report file is missing or empty: $expected_report" >&2
            exit 1
          fi

          actual_report_sha256="$(sha256sum "$expected_report" | awk '{print $1}')"
          if [ -z "$EXPECTED_REPORT_SHA256" ] || [ "$actual_report_sha256" != "$EXPECTED_REPORT_SHA256" ]; then
            echo "Report SHA-256 mismatch: expected '$EXPECTED_REPORT_SHA256', got '$actual_report_sha256'." >&2
            exit 1
          fi

          if ! jq -e --arg tid "$expected_task_id" '.taskId == $tid' "$expected_report" >/dev/null 2>&1; then
            echo "Report taskId mismatch in $expected_report." >&2
            exit 1
          fi

          bytes="$(wc -c < "$patch")"
          if [ "$bytes" -gt 50000 ]; then
            echo "Patch exceeds maximum allowed size of 50000 bytes (${bytes} bytes)." >&2
            exit 1
          fi

          actual_sha256="$(sha256sum "$patch" | awk '{print $1}')"
          if [ -z "$EXPECTED_SHA256" ] || [ "$actual_sha256" != "$EXPECTED_SHA256" ]; then
            echo "Patch SHA-256 mismatch: expected '$EXPECTED_SHA256', got '$actual_sha256'." >&2
            exit 1
          fi

          if LC_ALL=C grep -q '[^[:print:][:space:]]' "$patch"; then
            echo "Non-printable byte detected in patch: $patch" >&2
            exit 1
          fi

          forbidden_patterns=(
            'rename from '
            'rename to '
            'copy from '
            'copy to '
            'old mode '
            'new mode '
            'GIT binary patch'
            'new file mode 120000'
          )

          for pat in "${forbidden_patterns[@]}"; do
            if grep -Fq "$pat" "$patch"; then
              echo "Disallowed patch operation or entry matching '$pat' in $patch." >&2
              exit 1
            fi
          done

          summary="$(git apply --summary "$patch" 2>&1)" || {
            echo "Failed to inspect patch summary for $patch." >&2
            exit 1
          }

          if printf '%s\n' "$summary" | grep -Eq '^[[:space:]]*(rename|copy|mode change)[[:space:]]'; then
            echo "Disallowed rename, copy, or mode change detected in patch summary." >&2
            exit 1
          fi

          if grep -Eq '^Binary files .* differ$' "$patch"; then
            echo "Disallowed binary diff detected in $patch." >&2
            exit 1
          fi

          is_disallowed_path() {
            local p="$1"
            case "$p" in
              /*|*/../*|../*|*/..|..|.git|.git/*|.github|.github/*|package.json|package-lock.json)
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }

          diff_headers=0
          declare -A expected_files=()
          while IFS= read -r line; do
            if [[ "$line" == "diff --git "* ]]; then
              if [[ "$line" == *'"'* ]] || [[ "$line" == *'\'* ]]; then
                echo "Disallowed quote or backslash in diff --git header: $line" >&2
                exit 1
              fi
              diff_headers=$((diff_headers + 1))
              rest="${line#diff --git }"
              if [[ "$rest" =~ ^a/([^[:space:]]+)[[:space:]]+b/([^[:space:]]+)$ ]]; then
                src_path="${BASH_REMATCH[1]}"
                dst_path="${BASH_REMATCH[2]}"
                if is_disallowed_path "$src_path"; then
                  echo "Disallowed source path in diff header: $src_path" >&2
                  exit 1
                fi
                if is_disallowed_path "$dst_path"; then
                  echo "Disallowed destination path in diff header: $dst_path" >&2
                  exit 1
                fi
                expected_files["$src_path"]=1
                expected_files["$dst_path"]=1
              else
                echo "Malformed diff --git header: $line" >&2
                exit 1
              fi
            fi
          done < "$patch"

          if [ "$diff_headers" -eq 0 ]; then
            echo "No diff --git headers found in patch: $patch" >&2
            exit 1
          fi

          numstat="$(git apply --numstat "$patch" 2>&1)" || {
            echo "Failed to compute numstat for $patch." >&2
            exit 1
          }

          file_count="$(printf '%s\n' "$numstat" | sed '/^$/d' | wc -l | tr -d '[:space:]')"
          if [ "$file_count" -lt 1 ] || [ "$file_count" -gt 3 ]; then
            echo "Patch modifies $file_count files; allowed range is 1 to 3." >&2
            exit 1
          fi

          while IFS=$'\t' read -r added deleted path; do
            [ -z "$path" ] && continue
            if [ "$added" = "-" ] || [ "$deleted" = "-" ]; then
              echo "Disallowed binary entry in numstat for path: $path" >&2
              exit 1
            fi
            if is_disallowed_path "$path"; then
              echo "Disallowed path in numstat: $path" >&2
              exit 1
            fi
          done <<< "$numstat"

          git apply --check "$patch"
          git apply "$patch"

          changed_paths=()
          while IFS= read -r p; do
            [ -z "$p" ] && continue
            if is_disallowed_path "$p" || [ -z "${expected_files[$p]+x}" ]; then
              echo "Unexpected or disallowed modified path after git apply: $p" >&2
              exit 1
            fi
            changed_paths+=("$p")
          done < <(git diff --name-only)

          while IFS= read -r p; do
            [ -z "$p" ] && continue
            if is_disallowed_path "$p" || [ -z "${expected_files[$p]+x}" ]; then
              echo "Unexpected or disallowed untracked path after git apply: $p" >&2
              exit 1
            fi
            changed_paths+=("$p")
          done < <(git ls-files --others --exclude-standard -- . ':(exclude)out' ':(exclude)out/')

          if [ "${#changed_paths[@]}" -eq 0 ] || [ "${#changed_paths[@]}" -gt 3 ]; then
            echo "Post-apply file count (${#changed_paths[@]}) outside 1..3 range." >&2
            exit 1
          fi

          git add -- "${changed_paths[@]}"

          staged_files="$(git diff --cached --name-only)"
          if [ -z "$staged_files" ]; then
            echo "No staged changes found before commit." >&2
            exit 1
          fi
          while IFS= read -r sp; do
            [ -z "$sp" ] && continue
            if is_disallowed_path "$sp" || [ -z "${expected_files[$sp]+x}" ]; then
              echo "Unexpected staged path before commit: $sp" >&2
              exit 1
            fi
          done <<< "$staged_files"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -m "Forge local-model patch (run ${RUN_ID}, sha256 ${actual_sha256})"
          git push origin HEAD
          pushed_sha="$(git rev-parse HEAD)"
          title="Forge local-model patch (run ${RUN_ID})"
          body="Run ID: ${RUN_ID}, patch sha256: ${actual_sha256}, report sha256: ${actual_report_sha256}, checks passed: ${EXPECTED_CHECKS_PASSED}. Forge's own checks ran in the workflow run job (see the linked run). Repository CI checks created by the workflow token start in an approval-required state and must be approved by a user with write access; this draft is unreviewed."

          verify_existing_pr() {
            local attempt pr_json pr_number
            for attempt in 1 2 3; do
              if pr_json="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --base main --state open --limit 10 --json number,isDraft,headRefName,baseRefName,headRefOid,title,body)"; then
                if pr_number="$(printf '%s' "$pr_json" | jq -er \
                  --arg branch "$branch" \
                  --arg pushed_sha "$pushed_sha" \
                  --arg title "$title" \
                  --arg body "$body" \
                  'if length == 1 and (.[0] | .isDraft == true and .headRefName == $branch and .baseRefName == "main" and .headRefOid == $pushed_sha and .title == $title and .body == $body) then .[0].number else empty end')"; then
                  echo "Recovered: PR #${pr_number} already exists and matches"
                  return 0
                fi
              fi
              if [ "$attempt" -lt 3 ]; then
                sleep 5
              fi
            done
            echo "Error: gh pr create failed and no matching open draft PR was found after 3 attempts." >&2
            return 1
          }

          if gh pr create --draft --base main --head "$branch" \
            --title "$title" \
            --body "$body"; then
            exit 0
          else
            echo "Warning: gh pr create failed; verifying whether PR already exists." >&2
            if verify_existing_pr; then
              exit 0
            else
              echo "Error: gh pr create failed and no existing PR could be verified." >&2
              exit 1
            fi
          fi
